services:
  app:
    image: webdevops/php-apache-dev:8.3
    ports:
      - "8080:80"
    volumes:
      - ./src:/crud_cakephp
    environment:
      WEB_DOCUMENT_ROOT: /crud_cakephp/webroot
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_app
      MYSQL_USER: my_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
#      PMA_USER: my_user
#      PMA_PASSWORD: secret
#PMA_USER: root             # ← my_user から root に変更/
#      PMA_PASSWORD: rootpassword # ← secret から rootpassword に変更
    depends_on:
      - db

volumes:
  db-data:

